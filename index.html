<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Verificação</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#f5f5f5;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      padding:20px;
    }

    .verificacao-box{
      width:80%;
      max-width:380px;
      background:white;
      border-radius:25px;
      padding:25px;
      text-align:center;
      box-shadow:0 10px 30px rgba(0,0,0,0.1);
    }

    .verificacao-box img{
      width:100%;
      border-radius:20px;
      margin-bottom:20px;
    }

    .titulo{
      font-size:26px;
      font-weight:bold;
      color:#111;
      margin-bottom:10px;
    }

    .descricao{
      color:#666;
      font-size:15px;
      line-height:1.5;
      margin-bottom:25px;
    }

    .check-area{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
      background:#f0f0f0;
      padding:15px;
      border-radius:15px;
      cursor:pointer;
      transition:0.3s;
    }

    .check-area:hover{
      background:#e8e8e8;
    }

    .check{
      width:22px;
      height:22px;
      accent-color:#00b894;
    }

    .texto-check{
      font-size:16px;
      color:#222;
      font-weight:600;
    }

    .botao{
      width:100%;
      margin-top:20px;
      padding:15px;
      border:none;
      border-radius:15px;
      background:#00b894;
      color:white;
      font-size:17px;
      font-weight:bold;
      cursor:pointer;
      transition:0.3s;
    }

    .botao:hover{
      background:#019875;
    }

    @media(max-width:480px){
      .titulo{
        font-size:22px;
      }

      .descricao{
        font-size:14px;
      }
    }
  </style>
</head>
<body>

  <div class="verificacao-box">

    <!-- <img src="" alt="Verificação"> -->

    <h1 class="titulo">Verificação de Segurança</h1>

    <p class="descricao">
      Confirme que você não é um robô para continuar acessando a página.
    </p>

    <label class="check-area">
      <input type="checkbox" class="check">
      <span class="texto-check">Não sou um robô</span>
    </label>

 <button class="botao" onclick="window.location.href='loja.html'">
  CONTINUAR
</button>

  </div>

</body>
</html>
